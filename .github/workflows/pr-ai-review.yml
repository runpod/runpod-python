# Stage 2 of 2 — PRIVILEGED, AND THE BLOCKING SECRET GATE.
#
# `workflow_run` fires after PR Security Scan finishes and runs in the BASE
# repository's context, so it gets KIMI_RUNPOD_API_KEY and a write-capable token
# even when the PR came from a fork.
#
# That privilege is why nothing here executes — or trusts — fork content:
#
#   * Neither job checks out the PR head. `actions/checkout` with no `ref` gets
#     the base repo's default branch: trusted, reviewed code.
#   * Neither job reads stage 1's artifact. Under `pull_request` GitHub runs the
#     workflow definition from the PR's own merge ref, so a hostile author
#     controls every byte stage 1 uploads — its diff, its findings and its
#     counts alike. Reading any of them let an attacker ship a backdoor while
#     uploading a two-line README diff, and have this workflow post "risk: none"
#     as a bot comment on the real PR before any human looked.
#   * Everything is derived from `workflow_run.head_sha`, which GitHub supplies
#     and a fork cannot forge. The PR number too, so the write token cannot be
#     aimed at a third party's PR.
#
# WHY THE SCAN RUNS HERE AS WELL AS IN STAGE 1. Stage 1's betterleaks run is
# advisory precisely because its output is attacker-controlled; a `count=0` next
# to a live key would otherwise skip the triage call and green the gate. The
# `head-scan` job below runs the same scanner with the same config from a
# workflow definition the PR cannot edit. The author still controls the bytes
# being scanned — that is the point — but no longer the scanner or the report.
#
# WHY TWO JOBS. `head-scan` runs a binary over attacker-supplied bytes, so it is
# kept credential-free: no Runpod key, no write token, read-only permissions. It
# hands `triage` a findings file containing locations and rule ids and no secret
# values. A parser bug in the scanner therefore lands in a job with nothing
# worth stealing and no way to publish.
#
# HOW THIS BLOCKS. A `workflow_run` job is not associated with the PR's check
# list, so this workflow's own conclusion cannot be a required check and its exit
# code blocks nothing. The gate is a COMMIT STATUS the script posts to
# `workflow_run.head_sha`, context `AI secret verdict` — require that context in
# a branch ruleset.
#
# It is deliberately fail-closed, so a Runpod outage, an unparseable reply, or a
# file the scanner could not read goes red rather than green. That is survivable
# only because of the escape hatch: a maintainer adds the
# `security-review-override` label to force the status green. Outside
# collaborators cannot label a PR in the base repo.
#
# Supply chain: only GitHub-owned actions, one checksum-pinned scanner binary,
# and the Python standard library. There is deliberately no `pip install` — an
# unpinned dependency resolved at run time in a job holding a paid API key and a
# write token is the sharpest edge a pipeline like this can have.

name: PR AI Security Review

on:
  workflow_run:
    workflows: ["PR Security Scan"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Keyed on the PR's branch identity with cancel-in-progress, so a push burst
  # collapses to ONE paid review instead of one per push. Cancelling the loser
  # also fixes the upsert_comment read-then-write race better than serialising
  # would: only one writer survives.
  group: pr-ai-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # Keep in lockstep with pr-security-scan.yml. The two runs are meant to see
  # the same thing; a version skew between them turns "stage 1 flagged it and
  # stage 2 did not" into a mystery rather than a signal.
  BETTERLEAKS_VERSION: "1.8.1"
  BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"

jobs:
  head-scan:
    name: Head scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      contains(github.event.workflow_run.path, 'pr-security-scan.yml')
    # `contains`, not `==`. `workflow_run.path` is a real field but GitHub does
    # not document the workflow_run payload at all, and the REST reference shows
    # this value with an `@ref` suffix. A strict equality that drifts would make
    # the `if:` false — and a job skipped by a conditional reports SUCCESS, so
    # stage 2 would stop reviewing every PR in the repo, indefinitely, with
    # nothing going red. `contains` tolerates a prefix or suffix change.
    #
    # Note this is a noise filter, NOT a trust anchor: the PR owns
    # pr-security-scan.yml, so it can make this match exactly. Safety comes from
    # not trusting anything stage 1 produced.

    permissions:
      contents: read
      pull-requests: read   # to resolve the head SHA to its PR and base SHA
      # Deliberately NOT statuses: write. This job runs a scanner over
      # attacker-supplied bytes; it must not be able to publish the verdict.

    steps:
      # No `ref:` — the trusted default branch, NOT the PR head.
      - name: Check out trusted base repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assert the payload shape we depend on
        # An undocumented field guarding a job that reports SUCCESS when skipped
        # needs to fail loudly rather than silently stop working.
        env:
          WR_PATH: ${{ github.event.workflow_run.path }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${WR_PATH}" ]; then
            echo "::error title=Payload drift::workflow_run.path is empty. The trigger filter is no longer meaningful — review this workflow."
            exit 1
          fi
          if ! printf '%s' "${WR_SHA}" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error title=Payload drift::workflow_run.head_sha is missing or malformed. Refusing to continue."
            exit 1
          fi
          echo "payload ok: path=${WR_PATH} sha=${WR_SHA}"

      - name: Install betterleaks (checksum-pinned)
        run: |
          set -euo pipefail
          curl -sSfL --proto '=https' --tlsv1.2 -o /tmp/betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          # FAIL, do not warn. This was a `::warning` against the literal
          # placeholder, which meant a version bump that forgot the checksum
          # ran the gate's own scanner unverified behind a line nobody reads —
          # the same shape as the semgrep pin that sat broken for months. A
          # digest test rather than a placeholder test, so empty, truncated,
          # uppercase and half-pasted values are caught too.
          if ! printf '%s' "$BETTERLEAKS_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error title=Unpinned binary::BETTERLEAKS_SHA256 is not a sha256 digest, so the scanner binary cannot be verified. Refusing to run it. Set it from the checksums file for v${BETTERLEAKS_VERSION}."
            exit 1
          fi
          echo "${BETTERLEAKS_SHA256}  /tmp/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp betterleaks
          sudo install -m 0755 /tmp/betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Scan the head files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          FINDINGS_PATH: ${{ runner.temp }}/head-findings.json
          SCAN_WORKDIR: ${{ runner.temp }}/head-tree
          BETTERLEAKS_CONFIG: .github/security/gitleaks-runpod.toml
        run: python .github/security/scan_head.py

      # No `if: always()`. On any failure the script writes no file, the upload
      # finds nothing, and the triage job fails closed on its absence — which is
      # the intended behaviour, not a gap.
      - name: Upload findings for triage
        uses: actions/upload-artifact@v7
        with:
          name: head-scan-findings
          path: ${{ runner.temp }}/head-findings.json
          retention-days: 7
          if-no-files-found: error

  triage:
    name: Kimi K3 review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: head-scan
    # `always()` so a failed or skipped scan still reaches the script, which
    # publishes a red status for it. Without this the gate would sit at
    # `pending` forever on exactly the runs that most need a verdict. The
    # trigger conditions are repeated because `always()` overrides the implicit
    # "skip when the dependency was skipped".
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      contains(github.event.workflow_run.path, 'pr-security-scan.yml')

    permissions:
      contents: read
      pull-requests: write    # to post the review comment
      statuses: write         # to publish the gate as a commit status on the head SHA

    steps:
      - name: Check out trusted base repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same run, so no `actions: read` and no run-id plumbing. Allowed to fail:
      # a missing findings file is a state the script must see and turn red, not
      # one that should abort the job before it can publish anything.
      - name: Download the head scan findings
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: head-scan-findings
          path: ${{ runner.temp }}/scan

      - name: Run Kimi K3 secret triage
        env:
          # LEFT is the env var the script reads; RIGHT is your GitHub secret's
          # name. Decoupled on purpose — rename the secret and only this changes.
          RUNPOD_API_KEY: ${{ secrets.KIMI_RUNPOD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The two GitHub-supplied values a fork cannot forge. Everything the
          # script trusts derives from these.
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SCAN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FINDINGS_PATH: ${{ runner.temp }}/scan/head-findings.json
          OUTPUT_DIR: ${{ runner.temp }}
          RUNPOD_ENDPOINT_ID: moonshot-kimi
          RUNPOD_MODEL: kimi-k3
          # Exactly "low", "high" or "max" — there is no "medium", and a bad
          # value is a 400 (the script retries without it rather than reddening
          # the gate). "high" is the endpoint default. Kept at "low" for cost:
          # reasoning bills as output at $15/1M, so this is the one dial that
          # matters. Raise it if triage starts clearing real credentials.
          KIMI_REASONING_EFFORT: low
        run: python .github/security/ai_security_review.py

      - name: Upload review payload for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-output
          path: |
            ${{ runner.temp }}/ai-review.json
            ${{ runner.temp }}/ai-review.md
          retention-days: 7
          if-no-files-found: ignore
