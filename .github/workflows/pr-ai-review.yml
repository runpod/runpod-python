# Stage 2 of the secret gate. The jobs live in runpod/secret_detector; see its README.
# Written by deploy-secret-gate.sh.
name: PR AI Security Review

on:
  workflow_run:
    workflows: ["PR Security Scan"]
    types: [completed]

permissions:
  contents: read

jobs:
  review:
    uses: runpod/secret_detector/.github/workflows/pr-ai-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    with:
      review-contacts: "runpod/security"
    secrets:
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
