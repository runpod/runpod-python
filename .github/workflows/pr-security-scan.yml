# Stage 1 of the secret gate. The job lives in runpod/secret_detector; see its README.
# Written by deploy-secret-gate.sh.
name: PR Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scan:
    uses: runpod/secret_detector/.github/workflows/pr-security-scan.yml@main
