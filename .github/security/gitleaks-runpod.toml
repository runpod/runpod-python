# betterleaks config: Runpod rules layered on the defaults.
# `useDefault = true` keeps the built-in rules; none of them match Runpod keys.

title = "Runpod deep-audit ruleset"

[extend]
useDefault = true

# The default global allowlist skips lockfiles, binaries and assets by path, and
# there is no directive to undo it. This rule re-scans those paths with no path
# allowlist of its own. Keep it broad.
[[rules]]
id          = "runpod-key-in-allowlisted-path"
description = "Runpod API key in a path gitleaks would otherwise skip (lockfile, binary, asset)"
regex       = '''\b(rpa_[A-Za-z0-9]{20,})\b'''
keywords    = ["rpa_"]
tags        = ["runpod", "api-key", "lockfile-bypass"]

  [[rules.allowlists]]
  description = "only obvious placeholders"
  regexTarget = "match"
  regexes = ['''(?i)(example|dummy|placeholder|xxxx+|your[_-]?key|redacted|000000)''']

# Current keys: rpa_ prefix, issued since 2024-11-11.
[[rules]]
id          = "runpod-api-key"
description = "Runpod API key (rpa_ prefix)"
# Real key bodies are 46 chars; 20-80 is deliberately wide.
regex       = '''\b(rpa_[A-Za-z0-9]{20,80})\b'''
keywords    = ["rpa_"]
tags        = ["runpod", "api-key"]

[[rules]]
id          = "runpod-api-key-in-url"
description = "Runpod API key in URL query parameter"
regex       = '''runpod\.io/[^\s"']*[?&]api_key=([A-Za-z0-9_\-]{16,64})'''
keywords    = ["runpod.io"]

# Catches non-rpa_ token formats. Noisy by design; the entropy gate trims placeholders.
[[rules]]
id          = "runpod-credential-assignment"
description = "RUNPOD_* credential assignment"
regex       = '''(?i)runpod_(?:api_key|token|secret)["']?\s*[:=]\s*["']([^"'\s]{12,120})["']'''
keywords    = ["runpod_api_key","runpod_token","runpod_secret"]
entropy     = 3.0

# Legacy UUID keys (before 2024-11-11) match only near "runpod", since a bare UUID
# looks like a request ID. Legacy keys without that context are unfindable; rotate them.
[[rules]]
id          = "runpod-legacy-uuid-key"
description = "Possible legacy Runpod API key (UUID near Runpod context)"
regex       = '''(?i)runpod[^\n]{0,40}?\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
keywords    = ["runpod"]

# Global placeholder allowlist. Must be top-level `[[allowlists]]`: a
# `[[rules.allowlists]]` here would bind only to the preceding rule.
[[allowlists]]
description = "ignore common placeholders across all rules"
regexTarget = "match"
regexes = [
  '''(?i)(example|dummy|placeholder|xxxx+|your[_-]?key|redacted|000000|changeme|sample)''',
]
